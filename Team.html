      <div class="team-showcase-shade" aria-hidden="true"></div>
      <img class="team-showcase-mp1-pfp" src="images\MP1-PFP.png" alt="Jeremy Balatan">

        <h1 class="team-showcase-spider">MILES MORALES</h1>

      <button class="team-member-button" type="button" data-index="3" data-theme="mp4" data-name="Haena Marasigan" data-spider="SPIDER-PUNK" data-age-birthday="16 years old · October 28, 2009" data-art="images\member-artwork\optimized\MP-4.jpg" aria-pressed="false" aria-label="Show Haena Marasigan as Spider-Punk">
